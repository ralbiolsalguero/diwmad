<!DOCTYPE html> 
<!-- Indica que este documento usa la versión HTML5. 
     Es obligatorio al principio de todo archivo HTML moderno. -->

<html lang="en">
<!-- Define el idioma principal del contenido como inglés ("en"). -->

<head>
    <meta charset="UTF-8">
    <!-- Especifica la codificación de caracteres del documento (UTF-8 permite todos los caracteres y símbolos). -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Permite que Internet Explorer use el modo más moderno de compatibilidad disponible. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que el diseño sea adaptable (responsive) al tamaño de pantalla, especialmente en móviles. -->

    <title>Document</title>
    <!-- Título que aparecerá en la pestaña del navegador. -->
     <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Cuerpo del documento, donde se muestra el contenido visible. -->

    <img src="img/wallpaper.jpg" alt="">
    <!-- Muestra una imagen proveniente de la carpeta "img" con el nombre "wallpaper.jpg".
         El atributo alt está vacío, pero debería describir brevemente la imagen 
         (por ejemplo: alt="Fondo de pantalla abstracto"). -->
</body>
</html>
