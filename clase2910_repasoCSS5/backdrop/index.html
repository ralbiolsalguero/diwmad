<!DOCTYPE html>
<!-- Indica que el documento está escrito en HTML5. Es obligatorio en la primera línea de cualquier documento HTML moderno. -->

<html lang="en">
<!-- Define el idioma principal del contenido del documento. En este caso “en” indica inglés. -->

<head>
    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres. UTF-8 es el estándar porque admite todo tipo de caracteres (acentos, emojis, etc.). -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Obliga a Internet Explorer a usar su modo más moderno y compatible. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página sea responsive, adaptándose al tamaño de la pantalla del dispositivo. -->

    <title>Document</title>
    <!-- Título que aparece en la pestaña del navegador. -->

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div>
        <h1>Bienvenido a mi web</h1>
        <!-- Título principal de la página, centrado en el medio de la pantalla. -->
    </div>
</body>
</html>
