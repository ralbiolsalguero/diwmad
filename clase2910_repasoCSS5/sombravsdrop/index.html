<!DOCTYPE html>
<!-- Indica que este documento está hecho con HTML5. Es obligatorio y le dice al navegador cómo interpretar el código. -->

<html lang="en">
<!-- Define el idioma principal del contenido de la página. “en” indica inglés. -->

<head>
    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres. UTF-8 permite mostrar cualquier símbolo o carácter especial. -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Permite que Internet Explorer use el motor de renderizado más moderno disponible. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que el diseño sea adaptable al ancho de cualquier dispositivo (móviles, tablets, ordenadores). -->

    <title>Document</title>
    <!-- Texto que aparece en la pestaña del navegador. -->

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Cuerpo del documento, visible para el usuario -->

    <img src="img/image3.png" alt="" class="logo">
    <!-- Primera imagen: usa box-shadow. 
         La sombra se aplica a todo el rectángulo del elemento <img>,
         aunque la imagen tenga fondo transparente. -->

    <img src="img/image4.png" alt="" class="logo2">
    <!-- Segunda imagen: usa drop-shadow. 
         La sombra se adapta a la forma real de la imagen, 
         respetando las zonas transparentes. -->
</body>
</html>
