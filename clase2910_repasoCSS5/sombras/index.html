<!DOCTYPE html>
<!-- Indica que el documento está hecho en HTML5. Es la primera línea obligatoria en cualquier página moderna. -->

<html lang="en">
<!-- Define que el idioma del contenido de la página es inglés. -->

<head>
    <meta charset="UTF-8">
    <!-- Indica la codificación de caracteres. UTF-8 es el estándar universal que permite acentos, emojis, etc. -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Hace que Internet Explorer use su versión más moderna del motor de renderizado. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite que la página sea adaptable (responsive) al ancho de pantalla de distintos dispositivos. -->

    <title>Document</title>
    <!-- Título que aparecerá en la pestaña del navegador. -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Cuerpo visible del documento. -->

    <div></div>
    <!-- Cuadro gris de 300x300px con sombras múltiples. -->

    <h1>Hola mundo</h1>
    <!-- Título con sombra en el texto. -->
</body>
</html>
