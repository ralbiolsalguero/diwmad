<!DOCTYPE html>
<!-- Indica que el documento está escrito en HTML5, la versión moderna de HTML. -->

<html lang="en">
<!-- Elemento raíz del documento. lang="en" indica que el idioma es inglés. -->

<head>
    <!-- Cabecera del documento: contiene metadatos y estilos, no se muestra directamente. -->

    <meta charset="UTF-8">
    <!-- Define la codificación UTF-8 (permite acentos, ñ, etc.). -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Obliga a Internet Explorer a usar su modo más moderno (Edge). -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página se adapte al ancho del dispositivo (responsive). -->

    <title>Document</title>
    <!-- Título que se muestra en la pestaña del navegador. -->

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
     <!-- ---------- CONTENIDO VISIBLE ---------- -->

     <div></div>
     <!-- Un solo cuadro violeta de 300x300px que se moverá 100px hacia abajo y 200px a la derecha. -->
</body>
</html>
