<!DOCTYPE html> <!-- Le dice al navegador que esto es un documento HTML5 moderno. -->
<html lang="en"> <!-- Raíz del documento; lang="en" indica que el contenido está en inglés. -->
<head> <!-- Cabecera: metadatos y configuración del documento (no se ve en la página). -->
     <meta charset="UTF-8"> <!-- Codificación de caracteres UTF-8 (admite tildes, ñ, símbolos...). -->
     <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Pide a IE usar el motor más moderno disponible. -->
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Hace que el ancho del “viewport” en móviles sea igual al ancho de pantalla
          y que el zoom inicial sea 1. Imprescindible para que se vea bien en móviles. -->

     <title>Document</title> <!-- Título que verás en la pestaña del navegador. -->

    <link rel="stylesheet" href="css/style.css">

</head>
<body> <!-- Lo que se ve en la página. -->
     
     <div></div> <!-- Un bloque vacío que, con los estilos, será un rectángulo azul. -->

</body>
</html>
