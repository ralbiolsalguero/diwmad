<!DOCTYPE html>
<!-- Indica que el documento está escrito en HTML5 (la versión moderna de HTML). -->

<html lang="en">
<!-- Elemento raíz del documento. lang="en" indica que el idioma es inglés. -->

<head>
    <!-- Parte invisible del documento: configuración, título y estilos. -->

    <meta charset="UTF-8">
    <!-- Codificación UTF-8 (permite caracteres especiales como ñ, tildes, etc.). -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Obliga a Internet Explorer a usar el motor más moderno (modo Edge). -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ajusta el ancho del contenido al ancho de la pantalla del dispositivo (responsive). -->

    <title>Document</title>
    <!-- Título que aparece en la pestaña del navegador. -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
     <div></div>
     <!-- Un bloque azul que ocupa todo el ancho de la página y 200px de alto. -->
</body>
</html>
