<!DOCTYPE html>
<!-- Indica que este documento está en HTML5 (versión moderna). -->

<html lang="en">
<!-- Raíz del documento. "lang=en" indica que el contenido está en inglés. -->

<head>
    <!-- Cabecera: configuración y estilos, no visible directamente. -->

    <meta charset="UTF-8">
    <!-- Codificación UTF-8 (permite mostrar acentos, ñ, etc.). -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Obliga a IE a usar el motor moderno (Edge). -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página se adapte al tamaño de la pantalla (responsive). -->

    <title>Document</title>
    <!-- Título que aparece en la pestaña del navegador. -->

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
     <!-- Cuerpo visible de la página -->
     <div></div>
     <!-- Cuadro de 300x300px donde cambia el tipo de cursor. -->
</body>
</html>
