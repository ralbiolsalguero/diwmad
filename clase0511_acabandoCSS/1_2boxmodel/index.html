<!DOCTYPE html> 
<!-- Indica que el documento está hecho con HTML5 (la versión moderna del estándar). -->

<html lang="en">
<!-- Elemento raíz de toda la página. El atributo lang="en" indica que el idioma principal es inglés. -->

<head>
    <!-- Zona “cerebro” de la página: aquí se pone información y configuración que no se muestra directamente. -->

    <meta charset="UTF-8">
    <!-- Indica que los caracteres están en formato UTF-8 (sirve para que se vean bien tildes, ñ, etc.). -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Le dice a Internet Explorer que use el modo más moderno disponible (“Edge”). -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Imprescindible en móviles: ajusta la página al ancho del dispositivo y el zoom inicial a 1. -->

    <title>Document</title>
    <!-- Título que aparece en la pestaña del navegador. -->

    <link rel="stylesheet" href="css/style.css">

</head>

<body>
     <!-- Zona visible de la página (lo que realmente se ve en pantalla). -->

     <div>
          <!-- Creamos un bloque (div) con los estilos anteriores. -->

          <p>
               <!-- Dentro del div, metemos un párrafo de texto. -->
               Lorem ipsum dolor sit amet consectetur adipisicing elit. 
               Iure libero modi consequatur provident quaerat et ipsa. 
               Nesciunt facere cumque, neque quae fugiat expedita eaque 
               laudantium dolorem impedit provident minima molestiae?
          </p>
          <!-- Texto de relleno (Lorem ipsum) para visualizar el espacio dentro del div. -->
     </div>

</body>
</html>
