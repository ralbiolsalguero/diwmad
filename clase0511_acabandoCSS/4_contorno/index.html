<!DOCTYPE html>
<!-- Indica que estamos usando HTML5 (la versión moderna del estándar). -->

<html lang="en">
<!-- Raíz del documento HTML. El atributo lang="en" indica que está en inglés. -->

<head>
     <!-- Parte que no se ve en pantalla: metadatos, configuración y estilos. -->

     <meta charset="UTF-8">
     <!-- Codificación de caracteres UTF-8 (para mostrar acentos, ñ, etc.). -->

     <meta http-equiv="X-UA-Compatible" content="IE=edge">
     <!-- Obliga a Internet Explorer a usar el motor moderno (Edge). -->

     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Hace que la página se adapte a pantallas de móviles (responsive). -->

     <title>Document</title>
     <!-- Título que aparece en la pestaña del navegador. -->

     <style>
          /* Empieza la hoja de estilos (CSS) */

          div {
               width: 200px;              /* Ancho del div: 200 píxeles */
               height: 200px;             /* Alto del div: 200 píxeles */
               background: blue;          /* Color de fondo azul */
               display: inline-block;     /* Permite colocar varios divs en línea */

               /* ---------- MÁRGENES ---------- */
               /* Espacio EXTERIOR (fuera del borde del elemento) */

               margin-top: 100px;    /* 100 píxeles arriba */
               margin-right: 50px;   /* 50 píxeles a la derecha */
               margin-bottom: 20px;  /* 20 píxeles abajo */
               margin-left: 200px;   /* 200 píxeles a la izquierda */

               /* Cada propiedad afecta un lado del elemento.
                  Pero escribir las 4 puede ser pesado, así que existen atajos (shorthand). */

               /* --- ATAJOS DE MARGIN --- */

               margin: 50px;
               /* Aplica 50px de margen en los 4 lados (arriba, derecha, abajo e izquierda). */

               margin: 50px 20px;
               /* Primer valor: arriba y abajo (50px)
                  Segundo valor: derecha e izquierda (20px)
                  → Orden: vertical | horizontal */

               margin: 80px 50px 20px;
               /* 3 valores → orden:
                  1️⃣ arriba (80px)
                  2️⃣ derecha e izquierda (50px)
                  3️⃣ abajo (20px) */

               margin: 80px 20px 50px 30px;
               /* 4 valores → orden SIEMPRE en sentido horario:
                  1️⃣ arriba: 80px
                  2️⃣ derecha: 20px
                  3️⃣ abajo: 50px
                  4️⃣ izquierda: 30px
                  ⚠️ Este es el que manda finalmente, porque es el último. */
          }

     </style>
</head>

<body>
     <div></div>
     <!-- Cuadro azul con 200x200px y márgenes aplicados. -->
</body>
</html>
