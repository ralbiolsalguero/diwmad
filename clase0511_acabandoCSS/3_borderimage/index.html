<!DOCTYPE html>
<!-- Indica que estamos usando HTML5, la versión actual del estándar web. -->

<html lang="en">
<!-- Raíz del documento HTML. El atributo lang="en" indica que el idioma es inglés. -->

<head>
    <!-- Zona de configuración: metadatos, título, estilos, etc. -->

    <meta charset="UTF-8">
    <!-- Indica la codificación UTF-8 (permite acentos, ñ, símbolos, etc.). -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Obliga a Internet Explorer a usar su motor más moderno (Edge). -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página se adapte al ancho del dispositivo (responsive). -->

    <title>Document</title>
    <!-- Texto que aparece en la pestaña del navegador. -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
     <!-- Contenido visible en la página -->
     
     <div></div>
     <!-- Un bloque cuadrado vacío que mostrará la imagen como borde. -->

</body>
</html>
