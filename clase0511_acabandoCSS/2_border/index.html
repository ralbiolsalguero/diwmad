<!DOCTYPE html>
<!-- Indica que el documento está hecho con HTML5, el estándar moderno. -->

<html lang="en">
<!-- Elemento raíz del documento. “lang=en” indica que el idioma es inglés. -->

<head>
    <!-- Parte invisible del documento: configuración, título y estilos. -->

    <meta charset="UTF-8">
    <!-- Usa codificación UTF-8 (permite acentos, ñ, etc.). -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Obliga a Internet Explorer a usar su motor más nuevo (modo Edge). -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ajusta la página al tamaño de la pantalla del dispositivo (responsive). -->

    <title>Document</title>
    <!-- Título que aparece en la pestaña del navegador. -->

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
     <!-- Contenido visible en la página -->

     <div>
          <!-- Un bloque de 200x200 px con el borde configurado arriba -->
          <p>
               Lorem, ipsum dolor sit amet consectetur adipisicing elit.
               Iste totam enim eius, delectus esse alias fugiat laborum vero repellat porro
               corrupti amet nulla molestias animi ut quae, sapiente sequi voluptatem.
          </p>
          <!-- Párrafo de texto dentro del div (relleno visual). -->
     </div>
</body>
</html>
